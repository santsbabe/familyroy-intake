name: FamilyRoy image intake unit tests
on:
  push:
    branches: ["fix/image-ocr-review-guard", "fix/ocr-school-and-domain-boundaries"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check:functions
