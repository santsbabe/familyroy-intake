<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FamilyRoy Preview Acceptance</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px}button{font:inherit;padding:14px 20px;border:0;border-radius:12px;cursor:pointer}pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:12px}.ok{color:#087830}.bad{color:#b00020}</style></head><body><h1>FamilyRoy Preview Acceptance</h1><p>This page tests the Deploy Preview only. It contains no family data and cannot expose the intake token.</p><button id="go">Run acceptance tests</button><h2 id="status"></h2><pre id="out">Not run yet.</pre><script>go.onclick=async()=>{go.disabled=true;status.textContent="Running…";try{const r=await fetch("/acceptance");const j=await r.json();status.textContent=j.ok?"✓ ALL TESTS PASSED":"✗ TESTS FAILED";status.className=j.ok?"ok":"bad";out.textContent=j.results.map(x=>(x.pass?"✓ ":"✗ ")+x.name+"\n"+JSON.stringify(x,null,2)).join("\n\n")}catch(e){status.textContent="✗ Could not run tests";status.className="bad";out.textContent=String(e)}finally{go.disabled=false}}</script></body></html>
