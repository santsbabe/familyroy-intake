<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FamilyRoy Preview Acceptance</title><style>body{font:16px system-ui;margin:0;background:#f6f2e9;color:#252525}.wrap{max-width:760px;margin:auto;padding:28px}h1{margin-bottom:6px}.sub{color:#666}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0001}.pass{border-left:7px solid #279b61}.fail{border-left:7px solid #c43d3d}.wait{border-left:7px solid #d29b2e}button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 18px;background:#222;color:white;cursor:pointer}pre{white-space:pre-wrap;font-size:12px;background:#f5f5f5;padding:10px;border-radius:10px}.big{font-size:22px;font-weight:800}</style></head><body><div class="wrap"><h1>FamilyRoy Intake — Preview Acceptance</h1><p class="sub">Synthetic data only. Production is untouched. No credential is exposed in this page.</p><button id="run">Run acceptance tests</button><div id="summary" class="card wait">Ready to test.</div><div id="results"></div></div><script>
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.querySelector('#run').onclick=async()=>{const b=document.querySelector('#run'),s=document.querySelector('#summary'),r=document.querySelector('#results');b.disabled=true;s.className='card wait';s.textContent='Running…';r.innerHTML='';try{const x=await fetch('/preview-acceptance'),j=await x.json();s.className='card '+(j.ok?'pass':'fail');s.innerHTML='<div class="big">'+(j.ok?'✅ ALL TESTS PASSED':'❌ TESTS NEED WORK')+'</div><div>Environment: '+esc(j.environment)+'</div>';r.innerHTML=j.tests.map(t=>'<div class="card '+(t.pass?'pass':'fail')+'"><b>'+(t.pass?'✅ ':'❌ ')+esc(t.name)+'</b><pre>'+esc(JSON.stringify(t.detail,null,2))+'</pre></div>').join('')}catch(e){s.className='card fail';s.textContent='Could not run tests: '+e}finally{b.disabled=false}};
</script></body></html>
